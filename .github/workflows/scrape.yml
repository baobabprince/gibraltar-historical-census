name: Scrape Gibraltar Census

on:
  workflow_dispatch:
    inputs:
      year:
        description: 'Census year to scrape'
        required: true
        default: '1911'
        type: choice
        options:
          - '1911'
      max_records:
        description: 'Maximum number of NEW records to fetch in this run'
        required: true
        default: '100'
        type: string
      delay:
        description: 'Delay between requests in seconds'
        required: false
        default: '0.5'
        type: string
      commit_results:
        description: 'Commit extracted data back to the repository'
        required: false
        default: true
        type: boolean

# Prevent concurrent scrapes from fighting over the same branch/data
concurrency:
  group: scrape-census-${{ inputs.year || '1911' }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run scraper (auto-resumes)
        run: |
          echo "Year=${{ inputs.year }} Max=${{ inputs.max_records }} Delay=${{ inputs.delay }}"
          python -u scripts/scrape_census.py \
            --year "${{ inputs.year }}" \
            --max "${{ inputs.max_records }}" \
            --delay "${{ inputs.delay }}" \
            --output "data/${{ inputs.year }}"

      - name: Show summary
        run: |
          echo "=== Meta ==="
          cat "data/${{ inputs.year }}/meta.json" || true
          echo ""
          echo "=== Record count ==="
          python -c "import json; d=json.load(open('data/${{ inputs.year }}/records.json')); print(len(d), 'records')"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: census-${{ inputs.year }}-${{ github.run_id }}
          path: |
            data/${{ inputs.year }}/records.json
            data/${{ inputs.year }}/records.csv
            data/${{ inputs.year }}/meta.json
          retention-days: 30

      - name: Commit and push results
        if: inputs.commit_results == true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "data/${{ inputs.year }}/"

          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          COUNT=$(python -c "import json; print(json.load(open('data/${{ inputs.year }}/meta.json'))['extracted'])")
          NEW=$(python -c "import json; print(json.load(open('data/${{ inputs.year }}/meta.json')).get('last_run_new', 0))")
          git commit -m "data: update ${{ inputs.year }} census – ${COUNT} total (+${NEW} new)"

          # Avoid race: rebase onto latest main, then push with retries
          git pull --rebase origin main || {
            echo "Rebase had issues – falling back to merge"
            git rebase --abort || true
            git fetch origin main
            git merge origin/main -m "merge remote main before data push" || true
          }

          for i in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Push succeeded"
              exit 0
            fi
            echo "Push rejected (attempt $i) – pulling and retrying..."
            git pull --rebase origin main || git pull origin main --no-edit || true
            sleep 2
          done

          echo "Push failed after retries – data is still available as artifact"
          exit 1
