name: Deploy GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build slim web data
        run: python scripts/build_web_data.py

      - name: Assemble site (no full JSON)
        run: |
          mkdir -p _site/data
          cp index.html app.js styles.css _site/
          # copy only slim data + meta + index — skip full records.json/csv
          for d in data/*/; do
            year=$(basename "$d")
            if [[ "$year" =~ ^[0-9]+$ ]]; then
              mkdir -p "_site/data/$year"
              cp "$d/records.slim.json" "_site/data/$year/" 2>/dev/null || true
              cp "$d/meta.json" "_site/data/$year/" 2>/dev/null || true
            fi
          done
          cp data/index.json _site/data/ 2>/dev/null || true
          # keep data README if present
          cp data/README.md _site/data/ 2>/dev/null || true
          echo "Site size:"
          du -sh _site
          find _site -type f -exec ls -la {} \; | sort -k5 -n | tail -20

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
